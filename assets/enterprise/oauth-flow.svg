<svg width="1080" height="380" viewBox="0 0 1080 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .t { font: 700 16px sans-serif; fill: #f1f5f9; }
    .s { font: 12.5px monospace; fill: #94a3b8; }
    .f { font: 12px monospace; fill: #a5b4fc; }
    .ok { font: 700 14px sans-serif; fill: #34d399; }
  </style>

  <rect width="1080" height="380" rx="16" fill="#0b1220"/>
  <text x="540" y="40" text-anchor="middle" class="t" fill="#38bdf8" font-size="20">登录流程 — 密码永不经过桌面应用</text>

  <!-- 泳道头 -->
  <rect x="80"  y="70" rx="10" width="240" height="46" fill="#12233d" stroke="#818cf8"/>
  <text x="200" y="99" text-anchor="middle" class="t">桌面登录引导窗</text>
  <rect x="420" y="70" rx="10" width="240" height="46" fill="#12233d" stroke="#38bdf8"/>
  <text x="540" y="99" text-anchor="middle" class="t">系统浏览器</text>
  <rect x="760" y="70" rx="10" width="240" height="46" fill="#101c33" stroke="#38bdf8"/>
  <text x="880" y="99" text-anchor="middle" class="t">企业网关</text>

  <!-- 步骤 1 -->
  <line x1="200" y1="116" x2="200" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar2)"/>
  <rect x="80" y="162" rx="8" width="240" height="40" fill="#0f2b4d"/>
  <text x="200" y="180" text-anchor="middle" class="s">① 打开浏览器登录</text>
  <text x="200" y="196" text-anchor="middle" class="f">PKCE verifier 生成</text>

  <line x1="322" y1="182" x2="420" y2="182" stroke="#64748b" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="660" y1="182" x2="760" y2="182" stroke="#64748b" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- 步骤 2 (浏览器+网关交互) -->
  <rect x="420" y="162" rx="8" width="240" height="40" fill="#0f2b4d"/>
  <text x="540" y="180" text-anchor="middle" class="s">② /login 表单登录</text>
  <text x="540" y="196" text-anchor="middle" class="f">→ 同意页 → 授权码</text>

  <!-- 步骤 3 (回跳) -->
  <line x1="760" y1="230" x2="420" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="590" y="222" text-anchor="middle" class="f">302 loopback 127.0.0.1:port?code=…&amp;state=…</text>

  <line x1="420" y1="248" x2="322" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#ar2)"/>
  <rect x="80" y="228" rx="8" width="240" height="40" fill="#0f2b4d"/>
  <text x="200" y="246" text-anchor="middle" class="s">③ 收 code · 校验 state</text>
  <text x="200" y="262" text-anchor="middle" class="f">loopback 一次性关闭</text>

  <!-- 步骤 4 -->
  <line x1="200" y1="268" x2="200" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#ar2)"/>
  <line x1="322" y1="308" x2="760" y2="308" stroke="#64748b" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="540" y="298" text-anchor="middle" class="f">④ POST /api/oauth/token (code+verifier) → access/refresh → safeStorage</text>

  <!-- 步骤 5 -->
  <line x1="760" y1="340" x2="322" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="540" y="330" text-anchor="middle" class="f">⑤ POST /api/llm/tokens (Bearer access) → v1.短期令牌 → env 热注入</text>

  <rect x="80" y="326" rx="8" width="240" height="36" fill="#052e1a" stroke="#34d399"/>
  <text x="200" y="350" text-anchor="middle" class="ok">✓ 进入主应用 · 开始工作</text>
</svg>
