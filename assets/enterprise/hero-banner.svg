<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101c33"/>
      <stop offset="100%" stop-color="#0d2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>

  <!-- 装饰网格 -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.35">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200"/>
    <path d="M150 0 V420 M350 0 V420 M550 0 V420 M750 0 V420 M950 0 V420"/>
  </g>

  <!-- 盾牌图标 -->
  <g transform="translate(96,120)" filter="url(#glow)">
    <path d="M64 8 L112 28 V78 C112 122 92 148 64 164 C36 148 16 122 16 78 V28 Z"
          fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="M44 84 L58 98 L88 62" fill="none" stroke="#38bdf8" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 标题 -->
  <text x="250" y="172" font-family="-apple-system,'Segoe UI','Noto Sans SC',sans-serif"
        font-size="54" font-weight="800" fill="#f1f5f9">DSH Desktop <tspan fill="#38bdf8">Enterprise</tspan></text>

  <!-- 定位语 -->
  <text x="252" y="226" font-family="-apple-system,'Segoe UI','Noto Sans SC',sans-serif"
        font-size="24" fill="#94a3b8">企业自部署 Agent 运行时平台的官方桌面客户端</text>
  <text x="252" y="262" font-family="-apple-system,'Segoe UI','Noto Sans SC',sans-serif"
        font-size="24" fill="#94a3b8">OAuth 登录 · 短期令牌 · 密钥永不离开网关</text>

  <!-- 徽章行 -->
  <g font-family="monospace" font-size="17">
    <rect x="252" y="296" rx="12" width="150" height="34" fill="#0f2b4d" stroke="#2d5a8f"/>
    <text x="327" y="319" text-anchor="middle" fill="#7dd3fc">MIT License</text>
    <rect x="416" y="296" rx="12" width="180" height="34" fill="#0f2b4d" stroke="#2d5a8f"/>
    <text x="506" y="319" text-anchor="middle" fill="#7dd3fc">Win · macOS · Linux</text>
    <rect x="610" y="296" rx="12" width="200" height="34" fill="#0f2b4d" stroke="#2d5a8f"/>
    <text x="710" y="319" text-anchor="middle" fill="#a5b4fc">Zero Telemetry</text>
  </g>

  <!-- 右侧:密钥隔离示意 -->
  <g transform="translate(880,96)">
    <rect x="0" y="0" rx="12" width="236" height="60" fill="#0f2b4d" stroke="#38bdf8"/>
    <text x="118" y="26" text-anchor="middle" font-size="16" fill="#e2e8f0" font-family="sans-serif">企业网关 🔐</text>
    <text x="118" y="47" text-anchor="middle" font-size="13" fill="#64748b" font-family="monospace">real key · master key</text>
    <line x1="118" y1="60" x2="118" y2="104" stroke="#818cf8" stroke-width="2.5"/>
    <polygon points="112,98 124,98 118,110" fill="#818cf8"/>
    <text x="182" y="88" font-size="12.5" fill="#a5b4fc" font-family="monospace" text-anchor="middle">v1.* 短期令牌</text>
    <rect x="0" y="112" rx="12" width="236" height="60" fill="#12233d" stroke="#64748b"/>
    <text x="118" y="138" text-anchor="middle" font-size="16" fill="#e2e8f0" font-family="sans-serif">桌面客户端 💻</text>
    <text x="118" y="159" text-anchor="middle" font-size="13" fill="#64748b" font-family="monospace">只持 10 分钟令牌</text>
  </g>
</svg>
